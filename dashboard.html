<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Droid Tycoon Dashboard</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #171e2e;
    --panel2: #1e263a;
    --border: #2a3450;
    --text: #e8ecf5;
    --muted: #93a0bd;
    --accent: #5ec2ff;
    --accent2: #ffb454;
    --good: #6ee7a0;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    padding: 24px;
  }
  nav {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }
  nav a {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
  }
  nav a.active {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(94, 194, 255, 0.08);
  }
  nav a:hover { color: var(--text); }

  h1 {
    font-size: 22px;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  h1 .tag {
    font-size: 12px;
    color: var(--muted);
    font-weight: normal;
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 999px;
  }
  .sub { color: var(--muted); margin-bottom: 22px; font-size: 13px; }

  .grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .panel h2 {
    font-size: 14px;
    margin: 0 0 16px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .section-label {
    font-size: 11px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 18px 0 8px;
  }
  .section-label:first-child { margin-top: 0; }

  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 620px) { .stats-row { grid-template-columns: 1fr 1fr; } }
  .stats-row-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 680px) { .stats-row-4 { grid-template-columns: 1fr 1fr; } }
  .stat {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 14px;
  }
  .stat .v { font-size: 21px; font-weight: 700; }
  .stat .v.accent { color: var(--accent); }
  .stat .v.gold { color: var(--accent2); }
  .stat .l { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .stat-editable { border-color: rgba(94,194,255,0.3); cursor: pointer; }
  .stat-editable:hover { border-color: var(--accent); background: rgba(94,194,255,0.06); }
  .stat-editable.stat-editing { cursor: default; }
  .stat-editable.stat-editing:hover { background: var(--panel2); border-color: rgba(94,194,255,0.3); }
  .stat-value-display { font-size: 21px; font-weight: 700; }
  .stat-edit-row { display: flex; align-items: center; gap: 6px; }
  .stat-value-input {
    flex: 1;
    min-width: 0;
    width: 100%;
    background: transparent;
    border: none;
    padding: 0;
    font-size: 21px;
    font-weight: 700;
    color: var(--text);
    font-family: inherit;
  }
  .stat-value-input:focus { outline: none; }
  .stat-value-input::placeholder { color: var(--muted); font-weight: 400; }
  .icon-btn {
    flex: none;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 13px;
    line-height: 1;
    padding: 0;
    cursor: pointer;
  }
  .icon-btn.confirm { color: var(--good); border-color: rgba(110,231,160,0.4); }
  .icon-btn.confirm:hover { background: rgba(110,231,160,0.12); border-color: var(--good); }
  .icon-btn.cancel { color: var(--bad); border-color: rgba(255,107,107,0.4); }
  .icon-btn.cancel:hover { background: rgba(255,107,107,0.12); border-color: var(--bad); }

  .empty-note { color: var(--muted); font-size: 13px; padding: 10px 0; }

  /* chart */
  .chart-wrap { width: 100%; overflow-x: auto; }
  svg text { fill: var(--muted); font-size: 10px; font-family: inherit; }

  /* share card */
  label { display: block; font-size: 12px; color: var(--muted); margin: 4px 0 6px; }
  input[type="text"], input[type="number"] {
    width: 100%;
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
  }
  input[type="text"]:focus, input[type="number"]:focus { outline: 1px solid var(--accent); }
  button {
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    font-size: 13px;
    padding: 8px 12px;
  }
  button:hover { border-color: var(--accent); }
  .btn-primary {
    background: var(--accent);
    color: #08131f;
    border-color: var(--accent);
    font-weight: 600;
    width: 100%;
    margin-top: 12px;
    padding: 10px;
  }
  .btn-primary:hover { filter: brightness(1.08); }
  #card-canvas {
    width: 100%;
    max-width: 520px;
    border-radius: 12px;
    border: 1px solid var(--border);
    display: block;
    margin: 12px auto 0;
  }

  .toggles-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 14px 0 6px;
  }
  .toggles-actions { display: flex; gap: 6px; }
  .link-btn {
    background: transparent;
    border: none;
    color: var(--accent);
    font-size: 11px;
    padding: 2px 4px;
    text-decoration: underline;
  }
  .link-btn:hover { border: none; color: var(--text); }
  .toggle-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 10px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    max-height: 220px;
    overflow-y: auto;
  }
  .toggle-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    color: var(--text);
    padding: 3px 0;
    cursor: pointer;
    margin: 0;
  }
  .toggle-item input[type="checkbox"] {
    width: 14px;
    height: 14px;
    accent-color: var(--accent);
    flex: none;
    cursor: pointer;
  }
</style>
</head>
<body>

<nav>
  <a href="dashboard.html" class="active">Dashboard</a>
  <a href="session-log.html">Session Log</a>
</nav>

<h1>Droid Tycoon Dashboard <span class="tag">local &middot; saved in this browser</span></h1>
<div class="sub">Overview of every logged session, plus a downloadable stat card to share your progress.</div>

<div class="grid">
  <div>
    <div class="panel">
      <h2>Totals</h2>
      <div id="stats-container"></div>
    </div>

    <div class="panel">
      <h2>Credits / Min Trend</h2>
      <div class="chart-wrap" id="chart-container"></div>
    </div>
  </div>

  <div class="panel">
    <h2>Share Card</h2>
    <label>Username</label>
    <input type="text" id="username-input" placeholder="Your name or handle">

    <div class="toggles-head">
      <label style="margin:0;">Stats to include</label>
      <div class="toggles-actions">
        <button type="button" class="link-btn" id="toggles-all">All</button>
        <button type="button" class="link-btn" id="toggles-none">None</button>
      </div>
    </div>
    <div class="toggle-list" id="share-toggles"></div>

    <canvas id="card-canvas" width="1000" height="620"></canvas>
    <button class="btn-primary" id="download-card">Download Share Card (PNG)</button>
  </div>
</div>

<script src="common.js"></script>
<script>
let entries = loadEntries();
let totals = computeTotals(entries);
let manualTotals = loadManualTotals();
let shareToggles = loadShareToggles();

const STAT_DEFS = [
  { id: 'totalCredits', label: 'TOTAL CREDITS', toggleLabel: 'Total Credits', color: '#5ec2ff', get: () => fmt(totals.totalCredits) },
  { id: 'currentCredits', label: 'CURRENT CREDITS', toggleLabel: 'Current Credits', color: '#5ec2ff', get: () => fmt(manualTotals.credits) },
  { id: 'avgRate', label: 'AVG CREDITS/MIN', toggleLabel: 'Avg Credits/Min', color: '#5ec2ff', get: () => fmt(totals.avgRate) },
  { id: 'totalCrystals', label: 'TOTAL NOVA CRYSTALS', toggleLabel: 'Total Nova Crystals', color: '#ffb454', get: () => fmt(totals.totalCrystals) },
  { id: 'currentCrystals', label: 'CURRENT NOVA CRYSTALS', toggleLabel: 'Current Nova Crystals', color: '#ffb454', get: () => fmt(manualTotals.crystals) },
  { id: 'totalChips', label: 'TOTAL CHIPS', toggleLabel: 'Total Chips', color: '#ffb454', get: () => fmt(totals.totalChips) },
  { id: 'currentChips', label: 'CURRENT CHIPS', toggleLabel: 'Current Chips', color: '#ffb454', get: () => fmt(manualTotals.chips) },
  { id: 'totalRebirths', label: 'TOTAL REBIRTHS', toggleLabel: 'Total Rebirths', color: '#c792ff', get: () => fmt(totals.totalRebirths) },
  { id: 'currentRebirths', label: 'CURRENT REBIRTHS', toggleLabel: 'Current Rebirths', color: '#c792ff', get: () => fmt(manualTotals.rebirths) },
  { id: 'totalSuperRebirths', label: 'TOTAL SUPER REBIRTHS', toggleLabel: 'Total Super Rebirths', color: '#c792ff', get: () => fmt(totals.totalSuperRebirths) },
  { id: 'currentSuperRebirths', label: 'CURRENT SUPER REBIRTHS', toggleLabel: 'Current Super Rebirths', color: '#c792ff', get: () => fmt(manualTotals.superRebirths) },
  { id: 'craftedDroids', label: 'TOTAL CRAFTED DROIDS', toggleLabel: 'Total Crafted Droids', color: '#6ee7a0', get: () => fmt(manualTotals.craftedForDroids) },
  { id: 'sessions', label: 'SESSIONS LOGGED', toggleLabel: 'Sessions Logged', color: '#e8ecf5', get: () => String(totals.sessions) },
  { id: 'playtime', label: 'TOTAL PLAYTIME', toggleLabel: 'Total Playtime', color: '#e8ecf5', get: () => formatDuration(totals.totalPlaytime) },
  { id: 'crafted', label: 'DROIDS CRAFTED', toggleLabel: 'Droids Crafted', color: '#6ee7a0', get: () => fmt(totals.totalCrafted) },
  { id: 'sold', label: 'DROIDS SOLD', toggleLabel: 'Droids Sold', color: '#6ee7a0', get: () => fmt(totals.totalSold) },
  { id: 'netHeld', label: 'NET DROIDS HELD', toggleLabel: 'Net Droids Held', color: '#6ee7a0', get: () => fmt(totals.totalCrafted - totals.totalSold) },
];

function isStatEnabled(id) {
  return shareToggles[id] !== false;
}

function renderShareToggles() {
  const container = document.getElementById('share-toggles');
  container.innerHTML = STAT_DEFS.map(def => `
    <label class="toggle-item">
      <input type="checkbox" class="toggle-checkbox" data-id="${def.id}" ${isStatEnabled(def.id) ? 'checked' : ''}>
      <span>${def.toggleLabel}</span>
    </label>
  `).join('');
  container.querySelectorAll('.toggle-checkbox').forEach(cb => {
    cb.addEventListener('change', () => {
      shareToggles[cb.dataset.id] = cb.checked;
      saveShareToggles(shareToggles);
      drawCard();
    });
  });
}

document.getElementById('toggles-all').addEventListener('click', () => {
  STAT_DEFS.forEach(def => { shareToggles[def.id] = true; });
  saveShareToggles(shareToggles);
  renderShareToggles();
  drawCard();
});
document.getElementById('toggles-none').addEventListener('click', () => {
  STAT_DEFS.forEach(def => { shareToggles[def.id] = false; });
  saveShareToggles(shareToggles);
  renderShareToggles();
  drawCard();
});

const MANUAL_FIELDS = [
  { key: 'credits', label: 'Current Credits' },
  { key: 'chips', label: 'Current Chips' },
  { key: 'crystals', label: 'Current Nova Crystals' },
  { key: 'rebirths', label: 'Current Rebirths' },
  { key: 'superRebirths', label: 'Current Super Rebirths' },
  { key: 'craftedDroids', label: 'Total Crafted  Droids' },
];
const MANUAL_FIELD_LABELS = Object.fromEntries(MANUAL_FIELDS.map(f => [f.key, f.label]));

function manualStatField(key) {
  return `<div class="stat stat-editable" id="manual-${key}-wrap"></div>`;
}

function renderStats() {
  const container = document.getElementById('stats-container');

  const manualHtml = `
    <div class="section-label">Current Totals <span style="color:var(--muted); text-transform:none; letter-spacing:0;">(your own numbers, not calculated from the log — click a value to edit)</span></div>
    <div class="stats-row">
      ${manualStatField('credits')}
      ${manualStatField('chips')}
      ${manualStatField('crystals')}
    </div>
    <div class="stats-row" style="margin-top:12px;">
      ${manualStatField('rebirths')}
      ${manualStatField('superRebirths')}
      ${manualStatField('craftedForDroids')}
    </div>
  `;

  if (entries.length === 0) {
    container.innerHTML = manualHtml + '<div class="empty-note">No sessions logged yet. Add entries on the Session Log page to see the rest of your dashboard fill in.</div>';
    wireManualTotalsInputs();
    return;
  }

  const netDroids = totals.totalCrafted - totals.totalSold;
  const dateRange = totals.firstDate === totals.lastDate
    ? totals.firstDate
    : `${totals.firstDate} → ${totals.lastDate}`;

  container.innerHTML = manualHtml + `
    <div class="section-label">Economy (Total)</div>
    <div class="stats-row-4">
      <div class="stat"><div class="v accent">${fmt(totals.totalCredits)}</div><div class="l">Total Credits</div></div>
      <div class="stat"><div class="v accent">${fmt(totals.avgRate)}</div><div class="l">Avg Credits / Min</div></div>
      <div class="stat"><div class="v gold">${fmt(totals.totalCrystals)}</div><div class="l">Nova Crystals</div></div>
      <div class="stat"><div class="v gold">${fmt(totals.totalChips)}</div><div class="l">Chips</div></div>
    </div>

    <div class="section-label">Droids</div>
    <div class="stats-row">
      <div class="stat"><div class="v">${fmt(totals.totalCrafted)}</div><div class="l">Crafted</div></div>
      <div class="stat"><div class="v">${fmt(totals.totalSold)}</div><div class="l">Sold</div></div>
      <div class="stat"><div class="v">${fmt(netDroids)}</div><div class="l">Net Held</div></div>
    </div>
    <div class="stats-row" style="margin-top:12px;">
      <div class="stat" style="grid-column: span 3;"><div class="v">${escapeHtml(totals.topDroidType)}</div><div class="l">Most-Crafted Type (${fmt(totals.topDroidCount)})</div></div>
    </div>

    <div class="section-label">Rebirths (Total)</div>
    <div class="stats-row">
      <div class="stat"><div class="v">${fmt(totals.totalRebirths)}</div><div class="l">Total Rebirths</div></div>
      <div class="stat"><div class="v">${fmt(totals.totalSuperRebirths)}</div><div class="l">Total Super Rebirths</div></div>
    </div>

    <div class="section-label">Activity</div>
    <div class="stats-row">
      <div class="stat"><div class="v">${totals.sessions}</div><div class="l">Sessions Logged</div></div>
      <div class="stat"><div class="v" style="font-size:16px;">${formatDuration(totals.totalPlaytime)}</div><div class="l">Total Playtime</div></div>
      <div class="stat"><div class="v" style="font-size:14px;">${escapeHtml(dateRange) || '-'}</div><div class="l">Date Range</div></div>
    </div>
    <div class="stats-row" style="margin-top:12px;">
      <div class="stat" style="grid-column: span 3;">
        <div class="v">${totals.best ? fmt(computeRate(totals.best)) + ' cr/min' : '-'}</div>
        <div class="l">Best Session${totals.best ? ' — ' + totals.best.date : ''}</div>
      </div>
    </div>
  `;
  wireManualTotalsInputs();
}

function wireManualTotalsInputs() {
  MANUAL_FIELDS.forEach(f => renderManualDisplay(f.key));
}

function renderManualDisplay(key) {
  const wrap = document.getElementById(`manual-${key}-wrap`);
  if (!wrap) return;
  const label = MANUAL_FIELD_LABELS[key];
  wrap.classList.remove('stat-editing');
  wrap.innerHTML = `
    <div class="v stat-value-display">${fmt(manualTotals[key])}</div>
    <div class="l">${label}</div>
  `;
  wrap.onclick = () => renderManualEdit(key);
}

function renderManualEdit(key) {
  const wrap = document.getElementById(`manual-${key}-wrap`);
  if (!wrap) return;
  const label = MANUAL_FIELD_LABELS[key];
  wrap.onclick = null;
  wrap.classList.add('stat-editing');
  const val = manualTotals[key];
  wrap.innerHTML = `
    <div class="stat-edit-row">
      <input type="number" step="any" class="stat-value-input" id="manual-${key}-input" placeholder="0" value="${val || ''}">
      <button type="button" class="icon-btn confirm" title="Save">&#10003;</button>
      <button type="button" class="icon-btn cancel" title="Cancel">&#10005;</button>
    </div>
    <div class="l">${label}</div>
  `;

  const input = wrap.querySelector('.stat-value-input');
  const confirmBtn = wrap.querySelector('.confirm');
  const cancelBtn = wrap.querySelector('.cancel');
  input.focus();
  input.select();

  const commit = () => {
    manualTotals[key] = parseFloat(input.value) || 0;
    saveManualTotals(manualTotals);
    renderManualDisplay(key);
    drawCard();
  };
  const cancel = () => renderManualDisplay(key);

  input.addEventListener('click', (ev) => ev.stopPropagation());
  confirmBtn.addEventListener('click', (ev) => { ev.stopPropagation(); commit(); });
  cancelBtn.addEventListener('click', (ev) => { ev.stopPropagation(); cancel(); });
  input.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); commit(); }
    if (ev.key === 'Escape') { ev.preventDefault(); cancel(); }
  });
}

function renderChart() {
  const container = document.getElementById('chart-container');
  const sorted = sortedByTimestamp(entries).filter(e => e.playtime > 0);
  if (sorted.length < 2) {
    container.innerHTML = '<div class="empty-note">Log at least two sessions to see a trend line.</div>';
    return;
  }

  const rates = sorted.map(computeRate);
  const w = Math.max(600, sorted.length * 60);
  const h = 220;
  const padL = 44, padR = 16, padT = 16, padB = 28;
  const maxRate = Math.max(...rates) * 1.1 || 1;
  const minRate = 0;

  const x = (i) => padL + (i / (sorted.length - 1)) * (w - padL - padR);
  const y = (v) => padT + (1 - (v - minRate) / (maxRate - minRate)) * (h - padT - padB);

  const points = rates.map((r, i) => `${x(i)},${y(r)}`).join(' ');
  const gridLines = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const val = maxRate * f;
    const yy = y(val);
    return `<line x1="${padL}" y1="${yy}" x2="${w - padR}" y2="${yy}" stroke="var(--border)" stroke-width="1"/>
            <text x="${padL - 8}" y="${yy + 3}" text-anchor="end">${fmt(val)}</text>`;
  }).join('');

  const xLabels = sorted.map((e, i) => {
    if (sorted.length > 12 && i % Math.ceil(sorted.length / 12) !== 0) return '';
    return `<text x="${x(i)}" y="${h - 6}" text-anchor="middle">${escapeHtml(e.date.slice(5))}</text>`;
  }).join('');

  const dots = rates.map((r, i) => `<circle cx="${x(i)}" cy="${y(r)}" r="3" fill="var(--accent)"/>`).join('');

  container.innerHTML = `
    <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      ${gridLines}
      <polyline points="${points}" fill="none" stroke="var(--accent)" stroke-width="2"/>
      ${dots}
      ${xLabels}
    </svg>
  `;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawCard() {
  const canvas = document.getElementById('card-canvas');
  const username = document.getElementById('username-input').value.trim() || 'Commander';

  const cards = STAT_DEFS.filter(def => isStatEnabled(def.id)).map(def => [def.label, def.get(), def.color]);

  const cols = 4;
  const marginX = 48;
  const gap = 16;
  const cardW = (canvas.width - marginX * 2 - gap * (cols - 1)) / cols;
  const cardH = 130;
  const startY = 190;
  const rows = Math.ceil(cards.length / cols);
  canvas.height = cards.length
    ? startY + rows * cardH + (rows - 1) * gap + 60
    : startY + 80;

  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  ctx.clearRect(0, 0, W, H);

  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#0f1420');
  bg.addColorStop(1, '#1a2440');
  ctx.fillStyle = bg;
  roundRect(ctx, 0, 0, W, H, 28);
  ctx.fill();

  ctx.strokeStyle = 'rgba(94,194,255,0.35)';
  ctx.lineWidth = 2;
  roundRect(ctx, 12, 12, W - 24, H - 24, 22);
  ctx.stroke();

  ctx.fillStyle = '#5ec2ff';
  ctx.font = '700 20px Segoe UI, Arial, sans-serif';
  ctx.fillText('DROID TYCOON', 48, 62);
  ctx.fillStyle = '#93a0bd';
  ctx.font = '400 14px Segoe UI, Arial, sans-serif';
  ctx.fillText('STATS CARD', 48, 84);

  ctx.fillStyle = '#e8ecf5';
  ctx.font = '700 34px Segoe UI, Arial, sans-serif';
  ctx.fillText(username, 48, 132);

  const dateStr = new Date().toISOString().slice(0, 10);
  ctx.fillStyle = '#93a0bd';
  ctx.font = '400 13px Segoe UI, Arial, sans-serif';
  ctx.fillText('Generated ' + dateStr, 48, 155);

  if (cards.length === 0) {
    ctx.fillStyle = '#5b6684';
    ctx.font = '400 14px Segoe UI, Arial, sans-serif';
    ctx.fillText('No stats selected — pick some above to build your card.', 48, startY + 10);
  }

  cards.forEach((c, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const cx = marginX + col * (cardW + gap);
    const cy = startY + row * (cardH + gap);

    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    roundRect(ctx, cx, cy, cardW, cardH, 14);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    roundRect(ctx, cx, cy, cardW, cardH, 14);
    ctx.stroke();

    ctx.fillStyle = c[2];
    const maxValWidth = cardW - 32;
    let valFont = 26;
    ctx.font = `700 ${valFont}px Segoe UI, Arial, sans-serif`;
    while (ctx.measureText(c[1]).width > maxValWidth && valFont > 14) {
      valFont -= 2;
      ctx.font = `700 ${valFont}px Segoe UI, Arial, sans-serif`;
    }
    ctx.fillText(c[1], cx + 16, cy + 56);

    ctx.fillStyle = '#93a0bd';
    ctx.font = '400 11px Segoe UI, Arial, sans-serif';
    wrapLabel(ctx, c[0], cx + 16, cy + 80, cardW - 32);
  });

  ctx.fillStyle = '#5b6684';
  ctx.font = '400 11px Segoe UI, Arial, sans-serif';
  ctx.fillText('Droid Tycoon Session Log', 48, H - 24);
}

function wrapLabel(ctx, text, x, y, maxWidth) {
  const words = text.split(' ');
  let line = '';
  let lineY = y;
  words.forEach((word, i) => {
    const test = line + word + ' ';
    if (ctx.measureText(test).width > maxWidth && line !== '') {
      ctx.fillText(line.trim(), x, lineY);
      line = word + ' ';
      lineY += 14;
    } else {
      line = test;
    }
  });
  ctx.fillText(line.trim(), x, lineY);
}

const usernameInput = document.getElementById('username-input');
usernameInput.value = loadUsername();
usernameInput.addEventListener('input', () => {
  saveUsername(usernameInput.value);
  drawCard();
});

document.getElementById('download-card').addEventListener('click', () => {
  const canvas = document.getElementById('card-canvas');
  const link = document.createElement('a');
  const nameSlug = (usernameInput.value.trim() || 'commander').toLowerCase().replace(/[^a-z0-9]+/g, '-');
  link.download = `droid-tycoon-stats-${nameSlug}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
});

renderStats();
renderChart();
renderShareToggles();
drawCard();
</script>

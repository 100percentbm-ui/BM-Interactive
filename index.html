<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Droid Tycoon Dashboard</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #171e2e;
    --panel2: #1e263a;
    --border: #2a3450;
    --text: #e8ecf5;
    --muted: #93a0bd;
    --accent: #5ec2ff;
    --accent2: #ffb454;
    --good: #6ee7a0;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    padding: 24px;
  }
  nav {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }
  nav a {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
  }
  nav a.active {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(94, 194, 255, 0.08);
  }
  nav a:hover { color: var(--text); }

  h1 {
    font-size: 22px;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  h1 .tag {
    font-size: 12px;
    color: var(--muted);
    font-weight: normal;
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 999px;
  }
  .sub { color: var(--muted); margin-bottom: 22px; font-size: 13px; }

  .grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .panel h2 {
    font-size: 14px;
    margin: 0 0 16px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .section-label {
    font-size: 11px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 18px 0 8px;
  }
  .section-label:first-child { margin-top: 0; }

  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 620px) { .stats-row { grid-template-columns: 1fr 1fr; } }
  .stat {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 14px;
  }
  .stat .v { font-size: 21px; font-weight: 700; }
  .stat .v.accent { color: var(--accent); }
  .stat .v.gold { color: var(--accent2); }
  .stat .l { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

  .empty-note { color: var(--muted); font-size: 13px; padding: 10px 0; }

  /* chart */
  .chart-wrap { width: 100%; overflow-x: auto; }
  svg text { fill: var(--muted); font-size: 10px; font-family: inherit; }

  /* share card */
  label { display: block; font-size: 12px; color: var(--muted); margin: 4px 0 6px; }
  input[type="text"] {
    width: 100%;
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
  }
  input[type="text"]:focus { outline: 1px solid var(--accent); }
  button {
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    font-size: 13px;
    padding: 8px 12px;
  }
  button:hover { border-color: var(--accent); }
  .btn-primary {
    background: var(--accent);
    color: #08131f;
    border-color: var(--accent);
    font-weight: 600;
    width: 100%;
    margin-top: 12px;
    padding: 10px;
  }
  .btn-primary:hover { filter: brightness(1.08); }
  #card-canvas {
    width: 100%;
    max-width: 520px;
    border-radius: 12px;
    border: 1px solid var(--border);
    display: block;
    margin: 12px auto 0;
  }
</style>
</head>
<body>

<nav>
  <a href="dashboard.html" class="active">Dashboard</a>
  <a href="session-log.html">Session Log</a>
</nav>

<h1>Droid Tycoon Dashboard <span class="tag">local &middot; saved in this browser</span></h1>
<div class="sub">Overview of every logged session, plus a downloadable stat card to share your progress.</div>

<div class="grid">
  <div>
    <div class="panel">
      <h2>Totals</h2>
      <div id="stats-container"></div>
    </div>

    <div class="panel">
      <h2>Credits / Min Trend</h2>
      <div class="chart-wrap" id="chart-container"></div>
    </div>
  </div>

  <div class="panel">
    <h2>Share Card</h2>
    <label>Username</label>
    <input type="text" id="username-input" placeholder="Your name or handle">
    <canvas id="card-canvas" width="1000" height="620"></canvas>
    <button class="btn-primary" id="download-card">Download Share Card (PNG)</button>
  </div>
</div>

<script src="common.js"></script>
<script>
let entries = loadEntries();
let totals = computeTotals(entries);

function renderStats() {
  const container = document.getElementById('stats-container');
  if (entries.length === 0) {
    container.innerHTML = '<div class="empty-note">No sessions logged yet. Add entries on the Session Log page to see your dashboard fill in.</div>';
    return;
  }

  const netDroids = totals.totalCrafted - totals.totalSold;
  const dateRange = totals.firstDate === totals.lastDate
    ? totals.firstDate
    : `${totals.firstDate} → ${totals.lastDate}`;

  container.innerHTML = `
    <div class="section-label">Economy</div>
    <div class="stats-row">
      <div class="stat"><div class="v accent">${fmt(totals.totalCredits)}</div><div class="l">Total Credits</div></div>
      <div class="stat"><div class="v accent">${fmt(totals.avgRate)}</div><div class="l">Avg Credits / Min</div></div>
      <div class="stat"><div class="v gold">${fmt(totals.totalCrystals)}</div><div class="l">Nova Crystals</div></div>
    </div>

    <div class="section-label">Droids</div>
    <div class="stats-row">
      <div class="stat"><div class="v">${fmt(totals.totalCrafted)}</div><div class="l">Crafted</div></div>
      <div class="stat"><div class="v">${fmt(totals.totalSold)}</div><div class="l">Sold</div></div>
      <div class="stat"><div class="v">${fmt(netDroids)}</div><div class="l">Net Held</div></div>
    </div>
    <div class="stats-row" style="margin-top:12px;">
      <div class="stat" style="grid-column: span 3;"><div class="v">${escapeHtml(totals.topDroidType)}</div><div class="l">Most-Crafted Type (${fmt(totals.topDroidCount)})</div></div>
    </div>

    <div class="section-label">Activity</div>
    <div class="stats-row">
      <div class="stat"><div class="v">${totals.sessions}</div><div class="l">Sessions Logged</div></div>
      <div class="stat"><div class="v" style="font-size:16px;">${formatDuration(totals.totalPlaytime)}</div><div class="l">Total Playtime</div></div>
      <div class="stat"><div class="v" style="font-size:14px;">${escapeHtml(dateRange) || '-'}</div><div class="l">Date Range</div></div>
    </div>
    <div class="stats-row" style="margin-top:12px;">
      <div class="stat" style="grid-column: span 3;">
        <div class="v">${totals.best ? fmt(computeRate(totals.best)) + ' cr/min' : '-'}</div>
        <div class="l">Best Session${totals.best ? ' — ' + totals.best.date : ''}</div>
      </div>
    </div>
  `;
}

function renderChart() {
  const container = document.getElementById('chart-container');
  const sorted = sortedByTimestamp(entries).filter(e => e.playtime > 0);
  if (sorted.length < 2) {
    container.innerHTML = '<div class="empty-note">Log at least two sessions to see a trend line.</div>';
    return;
  }

  const rates = sorted.map(computeRate);
  const w = Math.max(600, sorted.length * 60);
  const h = 220;
  const padL = 44, padR = 16, padT = 16, padB = 28;
  const maxRate = Math.max(...rates) * 1.1 || 1;
  const minRate = 0;

  const x = (i) => padL + (i / (sorted.length - 1)) * (w - padL - padR);
  const y = (v) => padT + (1 - (v - minRate) / (maxRate - minRate)) * (h - padT - padB);

  const points = rates.map((r, i) => `${x(i)},${y(r)}`).join(' ');
  const gridLines = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const val = maxRate * f;
    const yy = y(val);
    return `<line x1="${padL}" y1="${yy}" x2="${w - padR}" y2="${yy}" stroke="var(--border)" stroke-width="1"/>
            <text x="${padL - 8}" y="${yy + 3}" text-anchor="end">${fmt(val)}</text>`;
  }).join('');

  const xLabels = sorted.map((e, i) => {
    if (sorted.length > 12 && i % Math.ceil(sorted.length / 12) !== 0) return '';
    return `<text x="${x(i)}" y="${h - 6}" text-anchor="middle">${escapeHtml(e.date.slice(5))}</text>`;
  }).join('');

  const dots = rates.map((r, i) => `<circle cx="${x(i)}" cy="${y(r)}" r="3" fill="var(--accent)"/>`).join('');

  container.innerHTML = `
    <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      ${gridLines}
      <polyline points="${points}" fill="none" stroke="var(--accent)" stroke-width="2"/>
      ${dots}
      ${xLabels}
    </svg>
  `;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawCard() {
  const canvas = document.getElementById('card-canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const username = document.getElementById('username-input').value.trim() || 'Commander';

  ctx.clearRect(0, 0, W, H);

  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#0f1420');
  bg.addColorStop(1, '#1a2440');
  ctx.fillStyle = bg;
  roundRect(ctx, 0, 0, W, H, 28);
  ctx.fill();

  ctx.strokeStyle = 'rgba(94,194,255,0.35)';
  ctx.lineWidth = 2;
  roundRect(ctx, 12, 12, W - 24, H - 24, 22);
  ctx.stroke();

  ctx.fillStyle = '#5ec2ff';
  ctx.font = '700 20px Segoe UI, Arial, sans-serif';
  ctx.fillText('DROID TYCOON', 48, 62);
  ctx.fillStyle = '#93a0bd';
  ctx.font = '400 14px Segoe UI, Arial, sans-serif';
  ctx.fillText('STATS CARD', 48, 84);

  ctx.fillStyle = '#e8ecf5';
  ctx.font = '700 34px Segoe UI, Arial, sans-serif';
  ctx.fillText(username, 48, 132);

  const dateStr = new Date().toISOString().slice(0, 10);
  ctx.fillStyle = '#93a0bd';
  ctx.font = '400 13px Segoe UI, Arial, sans-serif';
  ctx.fillText('Generated ' + dateStr, 48, 155);

  const netDroids = totals.totalCrafted - totals.totalSold;
  const cards = [
    ['TOTAL CREDITS', fmt(totals.totalCredits), '#5ec2ff'],
    ['AVG CREDITS/MIN', fmt(totals.avgRate), '#5ec2ff'],
    ['NOVA CRYSTALS', fmt(totals.totalCrystals), '#ffb454'],
    ['SESSIONS LOGGED', String(totals.sessions), '#e8ecf5'],
    ['TOTAL PLAYTIME', formatDuration(totals.totalPlaytime), '#e8ecf5'],
    ['DROIDS CRAFTED', fmt(totals.totalCrafted), '#6ee7a0'],
    ['DROIDS SOLD', fmt(totals.totalSold), '#6ee7a0'],
    ['NET DROIDS HELD', fmt(netDroids), '#6ee7a0'],
  ];

  const cols = 4;
  const marginX = 48;
  const gap = 16;
  const cardW = (W - marginX * 2 - gap * (cols - 1)) / cols;
  const cardH = 130;
  const startY = 190;

  cards.forEach((c, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const cx = marginX + col * (cardW + gap);
    const cy = startY + row * (cardH + gap);

    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    roundRect(ctx, cx, cy, cardW, cardH, 14);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    roundRect(ctx, cx, cy, cardW, cardH, 14);
    ctx.stroke();

    ctx.fillStyle = c[2];
    const maxValWidth = cardW - 32;
    let valFont = 26;
    ctx.font = `700 ${valFont}px Segoe UI, Arial, sans-serif`;
    while (ctx.measureText(c[1]).width > maxValWidth && valFont > 14) {
      valFont -= 2;
      ctx.font = `700 ${valFont}px Segoe UI, Arial, sans-serif`;
    }
    ctx.fillText(c[1], cx + 16, cy + 56);

    ctx.fillStyle = '#93a0bd';
    ctx.font = '400 11px Segoe UI, Arial, sans-serif';
    wrapLabel(ctx, c[0], cx + 16, cy + 80, cardW - 32);
  });

  ctx.fillStyle = '#5b6684';
  ctx.font = '400 11px Segoe UI, Arial, sans-serif';
  ctx.fillText('Droid Tycoon Session Log', 48, H - 24);
}

function wrapLabel(ctx, text, x, y, maxWidth) {
  const words = text.split(' ');
  let line = '';
  let lineY = y;
  words.forEach((word, i) => {
    const test = line + word + ' ';
    if (ctx.measureText(test).width > maxWidth && line !== '') {
      ctx.fillText(line.trim(), x, lineY);
      line = word + ' ';
      lineY += 14;
    } else {
      line = test;
    }
  });
  ctx.fillText(line.trim(), x, lineY);
}

const usernameInput = document.getElementById('username-input');
usernameInput.value = loadUsername();
usernameInput.addEventListener('input', () => {
  saveUsername(usernameInput.value);
  drawCard();
});

document.getElementById('download-card').addEventListener('click', () => {
  const canvas = document.getElementById('card-canvas');
  const link = document.createElement('a');
  const nameSlug = (usernameInput.value.trim() || 'commander').toLowerCase().replace(/[^a-z0-9]+/g, '-');
  link.download = `droid-tycoon-stats-${nameSlug}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
});

renderStats();
renderChart();
drawCard();
</script>

</body>
</html>
